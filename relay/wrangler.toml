# VRAKK — релей заявок + мини-CRM в Telegram (Cloudflare Worker)
# Секретов и персональных данных здесь нет. Имена секретов и как их задать — в README.md.
# Идентификатор аккаунта Cloudflare в этот файл не пишем: npx wrangler login или переменная CLOUDFLARE_ACCOUNT_ID.
name = "vrakk-leads"
main = "cloudflare-worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
# Origin сайта (не путь). Несколько значений — через запятую.
ALLOWED_ORIGIN = "https://tosha78.github.io"

# Секреты задаются отдельно, не в этом файле:
#   npx wrangler secret put TG_TOKEN
#   npx wrangler secret put TG_CHAT_ID
#   npx wrangler secret put WEBHOOK_SECRET

# id неймспейса — не секрет (без API-токена данные не прочитать), нужен для привязки LEADS.
[[kv_namespaces]]
binding = "LEADS"
id = "9422cdc6a6244db093657c1d0ad6e1c8"
